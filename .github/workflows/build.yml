name: Build Linux downloads

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux GUI and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 pkexec acl xvfb xauth dbus-x11
      - name: Test protocol and profile operations
        run: python3 -m unittest discover -s tests -v
      - name: Build downloads
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'from pulsar3 import __version__; print(__version__)')
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "v$version" || { echo 'Tag must match pulsar3.__version__'; exit 1; }
          else
            version="$version+git.${GITHUB_SHA:0:7}"
          fi
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python3 tools/build_release.py --version "$version"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Install and inspect the Debian package
        run: |
          dpkg-deb --info dist/*.deb
          sudo dpkg -i dist/*.deb
          cd /tmp
          pulsar3 plan /usr/lib/pulsar3-studio/pulsar3/data/default.json > /tmp/pulsar-plan.json
      - name: Exercise the installed GUI without a mouse
        env:
          PYTHONPATH: /usr/lib/pulsar3-studio
          PULSAR_TEST_INSTALLED: '1'
          PULSAR_NO_SCREENSHOTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
        run: xvfb-run -a dbus-run-session -- python3 tools/gui_smoke.py
      - name: Upload Linux downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulsar3-studio-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Explain downloads
        run: |
          echo '## Linux downloads' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **pulsar3-studio-linux** below. It contains a Debian package, a Linux archive, and SHA256 checksums.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The archive requires system Python/GTK dependencies; it is not a self-contained AppImage. See the README for installation.' >> "$GITHUB_STEP_SUMMARY"

  compatibility:
    name: GUI on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'debian:12', 'fedora:44']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install desktop and test dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 pkexec acl xvfb xauth dbus-x11
          else
            dnf install -y python3 python3-gobject gobject-introspection gtk4 libadwaita polkit acl xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon
          fi
      - name: Test profiles and protocol
        run: python3 -m unittest discover -s tests -v
      - name: Exercise desktop controls on X11
        env:
          PULSAR_NO_SCREENSHOTS: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
        run: xvfb-run -a dbus-run-session -- python3 tools/gui_smoke.py

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pulsar3-studio-linux
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Pulsar 3 Studio $GITHUB_REF_NAME"
